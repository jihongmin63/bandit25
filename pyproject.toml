[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bandit25"
version = "0.1.0"
requires-python = ">=3.7"
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "seaborn",
    "tqdm",
    "torchviz",
]

[tool.setuptools.packages.find]
where = ["src"]
